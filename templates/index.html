<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DermaScan AI | Personalized Skincare</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f5faf7;
            color: #243b35;
            font-family: Arial, sans-serif;
        }

        main {
            width: 100%;
            max-width: 680px;
            padding: 56px 40px;
            border: 1px solid #e1eee7;
            border-radius: 20px;
            background: #ffffff;
            text-align: center;
            box-shadow: 0 12px 36px rgba(36, 59, 53, 0.08);
        }

        .eyebrow {
            margin: 0 0 16px;
            color: #4d8b70;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #244f40;
            font-size: clamp(2.3rem, 7vw, 3.5rem);
        }

        .description {
            max-width: 500px;
            margin: 20px auto 30px;
            color: #5d7069;
            font-size: 1.1rem;
            line-height: 1.7;
        }

        .profile-button {
            display: inline-block;
            padding: 14px 24px;
            border: 0;
            border-radius: 999px;
            background: #4d8b70;
            color: #ffffff;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
        }

        .profile-button:hover {
            background: #3d755d;
        }

        .profile-button:focus-visible {
            outline: 3px solid #b7d9c6;
            outline-offset: 3px;
        }

        @media (max-width: 480px) {
            main {
                padding: 40px 24px;
            }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Your guide to healthier skin</p>
        <h1>DermaScan AI</h1>
        <p class="description">
            Get personalized skincare recommendations with an intelligent platform
            designed to help you understand your skin and build a routine that suits you.
        </p>
        <a class="profile-button" href="/profile">Create Skin Profile</a>
    </main>
</body>
</html>
